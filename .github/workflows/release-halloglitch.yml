name: HalloGlitch Release & Distribution

'on':
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create as prerelease'
        required: false
        type: boolean
        default: false
      build_only:
        description: 'Build and validate only (do not publish release)'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish HalloGlitch (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.15.0'

      - name: Install Python Dependencies
        run: |
          uv sync --extra all --all-groups

      - name: Install Workspace Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run Core Test Suites
        run: |
          uv run python scripts/run_tests_parallel.py tests/hermes_cli/test_skin_cmd.py tests/hermes_cli/test_skin_engine.py tests/hermes_cli/test_skin_palettes.py tests/hermes_cli/test_banner.py tests/hermes_cli/test_banner_distribution_label.py tests/hermes_cli/test_banner_release_channel.py tests/hermes_cli/test_banner_skills.py tests/hermes_cli/test_banner_skills_width.py tests/agent/test_prompt_builder.py

      - name: Build Python CLI Wheel Package
        run: |
          uv build --wheel
        env:
          HERMES_NIX_BUILD: "1"

      - name: Build TUI Distribution
        run: |
          pnpm --filter hermes-tui run build

      - name: Build Web Dashboard Distribution
        run: |
          pnpm --filter web run build

      - name: Build Desktop Renderer & Main Process
        run: |
          pnpm --dir apps/desktop run build

      - name: Build Desktop Windows Installer (NSIS)
        run: |
          node apps/desktop/scripts/run-electron-builder.mjs --win nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Artifacts & Generate Checksums
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          # Stage desktop installer if built
          if (Test-Path "apps/desktop/release/*.exe") {
            Copy-Item "apps/desktop/release/*.exe" release-artifacts/
          }
          if (Test-Path "apps/desktop/release/*.blockmap") {
            Copy-Item "apps/desktop/release/*.blockmap" release-artifacts/
          }
          # Stage Python CLI wheels
          if (Test-Path "dist/*.whl") {
            Copy-Item "dist/*.whl" release-artifacts/
          }
          if (Test-Path "dist/*.tar.gz") {
            Copy-Item "dist/*.tar.gz" release-artifacts/
          }
          # Generate SHA256 checksums
          Get-ChildItem -File release-artifacts | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -FilePath release-artifacts/SHA256SUMS.txt -Encoding utf8
          }
          Get-Content release-artifacts/SHA256SUMS.txt

      - name: Validate Required Artifacts
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path "release-artifacts/*.whl" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wheel -or $wheel.Length -eq 0) {
            throw "CRITICAL RELEASE FAILURE: Distributable Python CLI wheel is missing or empty!"
          }
          Write-Host "✓ Verified Wheel: $($wheel.Name) ($($wheel.Length) bytes)"

          $checksums = Get-Item -Path "release-artifacts/SHA256SUMS.txt" -ErrorAction SilentlyContinue
          if (-not $checksums -or $checksums.Length -eq 0) {
            throw "CRITICAL RELEASE FAILURE: SHA256SUMS.txt is missing or empty!"
          }
          Write-Host "✓ Verified Checksum Manifest: $($checksums.Length) bytes"

          $exe = Get-ChildItem -Path "release-artifacts/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            throw "CRITICAL RELEASE FAILURE: Windows NSIS installer (.exe) is missing from release-artifacts! The official Windows release cannot proceed without a valid desktop installer."
          }
          if ($exe.Length -eq 0) {
            throw "CRITICAL RELEASE FAILURE: Windows NSIS installer ($($exe.Name)) is 0 bytes (empty file)!"
          }
          Write-Host "✓ Verified Desktop Installer: $($exe.Name) ($($exe.Length) bytes)"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halloglitch-build-artifacts
          path: release-artifacts/
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' || (github.event.inputs.build_only != 'true' && github.event.inputs.build_only != true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: HalloGlitch ${{ github.event.inputs.tag || github.ref_name }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: release-artifacts/*
          body: |
            # HalloGlitch ⚡ — Universal Agent: An Agent Without Boundaries

            Official release of HalloGlitch built on the Hermes Agent core.

            ### Downloadable Release Artifacts
            - **Windows Desktop Installer**: `HalloGlitch-Setup-<version>.exe` (Standalone setup installer for Windows 10/11 x64).
            - **Python CLI Wheel Package**: `hermes_agent-<version>-py3-none-any.whl` (Standard Python wheel for terminal users; install via `uv pip install`).
            - **Integrity Manifest**: `SHA256SUMS.txt` (Cryptographic SHA-256 hashes for all downloadable files).

            ### Built-In Capabilities
            - **Integrated Terminal UI (TUI)**: Ink console interface bundled with the runtime.
            - **Embedded Web Dashboard**: Management SPA served locally via `halloglitch dashboard`.
            ### Integrity & Checksums
            See `SHA256SUMS.txt` attached below for cryptographic verification.

            ### Security Notice for Unsigned Builds
            Windows SmartScreen will prompt with *"Windows protected your PC"* on unsigned test installers. Click **More info** -> **Run anyway** to proceed.

            ---
            *HalloGlitch is an independent downstream product identity and fork of [NousResearch/hermes-agent](https://github.com/NousResearch/hermes-agent) (MIT License).*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
