name: HalloGlitch Release & Distribution

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create as prerelease'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish HalloGlitch (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.15.0'

      - name: Install Python Dependencies
        run: |
          uv sync --extra all

      - name: Install Workspace Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run Core Test Suites
        run: |
          uv run python scripts/run_tests_parallel.py tests/hermes_cli/test_skin* tests/hermes_cli/test_banner* tests/agent/test_prompt_builder*

      - name: Build Python CLI Wheel Package
        run: |
          uv build --wheel
        env:
          HERMES_NIX_BUILD: "1"

      - name: Build Web Dashboard Distribution
        run: |
          pnpm --filter web run build

      - name: Build Desktop Renderer & Main Process
        run: |
          pnpm --dir apps/desktop run build

      - name: Build Desktop Windows Installer (NSIS)
        run: |
          node apps/desktop/scripts/run-electron-builder.mjs --win nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Python CLI Wheel Package
        run: |
          uv build

      - name: Stage Artifacts & Generate Checksums
        id: stage
        shell: pwsh
        run: |
          mkdir -p release-artifacts
          # Copy desktop installers if generated
          if (Test-Path "apps/desktop/release/*.exe") {
            Copy-Item "apps/desktop/release/*.exe" release-artifacts/
          }
          if (Test-Path "apps/desktop/release/*.blockmap") {
            Copy-Item "apps/desktop/release/*.blockmap" release-artifacts/
          }
          # Copy Python CLI wheels
          if (Test-Path "dist/*.whl") {
            Copy-Item "dist/*.whl" release-artifacts/
          }
          if (Test-Path "dist/*.tar.gz") {
            Copy-Item "dist/*.tar.gz" release-artifacts/
          }
          # Generate SHA256 checksums
          Get-ChildItem release-artifacts | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -FilePath release-artifacts/SHA256SUMS.txt -Encoding utf8
          }
          Get-Content release-artifacts/SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: HalloGlitch ${{ github.event.inputs.tag || github.ref_name }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: release-artifacts/*
          body: |
            # HalloGlitch ⚡ — Universal Agent: An Agent Without Boundaries

            Official release of HalloGlitch built on the Hermes Agent core.

            ### Package Contents
            - **Desktop Windows Installer**: Standalone setup executable for Windows.
            - **CLI & Agent Wheel**: Distributable Python package for terminal execution.
            - **Terminal UI (TUI)**: Integrated Ink console experience.
            - **Web Dashboard**: Embedded FastAPI + React management SPA.

            ### Integrity & Checksums
            See `SHA256SUMS.txt` attached below for cryptographic verification.

            ### Security Notice for Unsigned Builds
            Windows SmartScreen will prompt with *"Windows protected your PC"* on unsigned test installers. Click **More info** -> **Run anyway** to proceed.

            ---
            *HalloGlitch is an independent downstream product identity and fork of [NousResearch/hermes-agent](https://github.com/NousResearch/hermes-agent) (MIT License).*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
